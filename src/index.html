<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>帳號管理器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ===== 自訂標題列 ===== -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <img src="curry_dog.png" onerror="if(this.src.indexOf('.png')!==-1){this.src='curry_dog.jpg';}else{this.style.display='none';}" alt="Icon" class="titlebar-mascot-img">
      <span class="titlebar-text">帳號管理器</span>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-theme-toggle" title="切換明亮 / 舒適深灰主題">
        <span id="theme-icon" style="font-size: 14px;">🌙</span>
      </button>
      <button class="titlebar-btn" id="btn-minimize" title="最小化">
        <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect width="10" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="關閉">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <!-- ===== 登入畫面 ===== -->
  <div class="auth-screen" id="auth-screen">
    <div class="auth-container">
      <div class="auth-logo">
        <div class="auth-mascot-wrap">
          <div class="mascot-glow"></div>
          <img src="curry_dog.png" onerror="if(this.src.indexOf('.png')!==-1){this.src='curry_dog.jpg';}" alt="Icon" class="auth-mascot-img">
        </div>
        <h1 class="auth-title">帳號管理器</h1>
        <p class="auth-subtitle">安全存儲，隨手掌握</p>
      </div>

      <!-- 設定主密碼（首次使用預設直接顯示） -->
      <div class="auth-form" id="setup-form">
        <h2 class="auth-form-title">建立主密碼</h2>
        <p class="auth-form-desc">設定一組主密碼來保護您的所有帳號資料。請務必記住此密碼，遺失將無法找回。</p>
        <div class="input-group">
          <label>主密碼</label>
          <div class="input-wrapper">
            <input type="password" id="setup-password" placeholder="請輸入主密碼（至少 6 位）" autocomplete="off">
            <button class="toggle-password" data-target="setup-password">👁️</button>
          </div>
        </div>
        <div class="input-group">
          <label>確認密碼</label>
          <div class="input-wrapper">
            <input type="password" id="setup-confirm" placeholder="請再次輸入主密碼" autocomplete="off">
            <button class="toggle-password" data-target="setup-confirm">👁️</button>
          </div>
        </div>
        <div class="password-strength" id="password-strength">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <span class="strength-text" id="strength-text"></span>
        </div>
        <button class="btn btn-primary btn-full" id="btn-setup">
          <span>🛡️</span> 建立保險庫
        </button>
      </div>

      <!-- 登入 -->
      <div class="auth-form" id="login-form" style="display:none;">
        <h2 class="auth-form-title">歡迎回來</h2>
        <p class="auth-form-desc">請輸入主密碼以解鎖您的帳號保險庫</p>
        <div class="input-group">
          <label>主密碼</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" placeholder="請輸入主密碼" autocomplete="off">
            <button class="toggle-password" data-target="login-password">👁️</button>
          </div>
        </div>
        <div class="auth-error" id="login-error" style="display:none;"></div>
        <button class="btn btn-primary btn-full" id="btn-login">
          <span>🔓</span> 解鎖
        </button>
      </div>
    </div>
    <div class="auth-particles" id="auth-particles"></div>
  </div>

  <!-- ===== 主介面 ===== -->
  <div class="main-app" id="main-app" style="display:none;">
    <!-- 側邊欄 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-info">
          <div class="user-avatar-wrap">
            <img src="curry_dog.png" onerror="if(this.src.indexOf('.png')!==-1){this.src='curry_dog.jpg';}" alt="Icon" class="user-avatar-mascot">
          </div>
          <div>
            <div class="user-name">帳號管理器</div>
            <div class="user-status">已加密保護</div>
          </div>
        </div>
      </div>

      <div class="sidebar-search">
        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="搜尋帳號...">
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">總覽</div>
          <button class="nav-item active" data-view="all">
            <span class="nav-icon">📋</span>
            <span class="nav-text">所有帳號</span>
            <span class="nav-badge" id="badge-all">0</span>
          </button>
          <button class="nav-item" data-view="favorites">
            <span class="nav-icon">⭐</span>
            <span class="nav-text">我的最愛</span>
            <span class="nav-badge" id="badge-favorites">0</span>
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">
            分類
            <button class="nav-section-action" id="btn-add-category" title="新增分類">+</button>
          </div>
          <div id="category-list"></div>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">
            標籤
          </div>
          <div id="tag-list" class="tag-list-sidebar"></div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-footer-btn" id="btn-import" title="匯入">
          <span>📥</span> 匯入
        </button>
        <button class="sidebar-footer-btn" id="btn-export" title="匯出">
          <span>📤</span> 匯出
        </button>
        <button class="sidebar-footer-btn" id="btn-logout" title="登出">
          <span>🔒</span> 鎖定
        </button>
      </div>
    </aside>

    <!-- 內容區 -->
    <main class="content">
      <div class="content-header">
        <div class="content-header-left">
          <h2 class="content-title" id="content-title">所有帳號</h2>
          <span class="content-count" id="content-count">0 個帳號</span>
        </div>
        <div class="content-header-right">
          <button class="btn btn-ghost" id="btn-toggle-view" title="切換檢視">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="btn btn-primary" id="btn-add-account">
            <span>+</span> 新增帳號
          </button>
        </div>
      </div>

      <!-- 帳號列表 -->
      <div class="account-grid" id="account-list"></div>

      <!-- 空狀態 -->
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">🔐</div>
        <h3>還沒有帳號</h3>
        <p>點擊「新增帳號」按鈕來添加你的第一個帳號</p>
        <button class="btn btn-primary" id="btn-add-first">
          <span>+</span> 新增帳號
        </button>
      </div>
    </main>
  </div>

  <!-- ===== 帳號編輯 Modal ===== -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="account-modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">新增帳號</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>帳號名稱 <span class="required">*</span></label>
          <input type="text" id="acc-name" placeholder="例如：Google、Steam、LINE...">
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>使用者名稱 / Email</label>
            <input type="text" id="acc-username" placeholder="帳號或 Email">
          </div>
          <div class="input-group">
            <label>密碼</label>
            <div class="input-wrapper">
              <input type="password" id="acc-password" placeholder="密碼">
              <button class="toggle-password" data-target="acc-password">👁️</button>
              <button class="btn-generate" id="btn-generate-pw" title="產生密碼">🎲</button>
            </div>
          </div>
        </div>
        <div class="input-group">
          <label>網址 / URL</label>
          <input type="text" id="acc-url" placeholder="https://...">
        </div>
        <div class="input-row">
          <div class="input-group">
            <label>分類</label>
            <select id="acc-category"></select>
          </div>
          <div class="input-group">
            <label>標籤</label>
            <div class="tag-input-container" id="acc-tags-container">
              <div class="tag-input-tags" id="acc-tags-display"></div>
              <input type="text" id="acc-tags-input" placeholder="輸入標籤後按 Enter">
            </div>
          </div>
        </div>

        <!-- 自訂欄位 -->
        <div class="custom-fields-section">
          <div class="custom-fields-header">
            <label>自訂欄位</label>
            <button class="btn btn-ghost btn-sm" id="btn-add-field">+ 新增欄位</button>
          </div>
          <div id="custom-fields-list"></div>
        </div>

        <div class="input-group">
          <label>備註</label>
          <textarea id="acc-notes" placeholder="額外備註..." rows="3"></textarea>
        </div>

        <div class="input-group">
          <label class="checkbox-label">
            <input type="checkbox" id="acc-favorite">
            <span>⭐ 加入我的最愛</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="modal-cancel">取消</button>
        <button class="btn btn-danger" id="modal-delete" style="display:none;">刪除</button>
        <button class="btn btn-primary" id="modal-save">儲存</button>
      </div>
    </div>
  </div>

  <!-- ===== 密碼產生器 Modal ===== -->
  <div class="modal-overlay" id="pwgen-overlay" style="display:none;">
    <div class="modal modal-sm" id="pwgen-modal">
      <div class="modal-header">
        <h3 class="modal-title">🎲 密碼產生器</h3>
        <button class="modal-close" id="pwgen-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="pwgen-preview">
          <code id="pwgen-result">————————</code>
          <button class="btn btn-ghost btn-sm" id="pwgen-copy" title="複製">📋</button>
        </div>
        <div class="input-group">
          <label>密碼長度: <span id="pwgen-length-val">16</span></label>
          <input type="range" id="pwgen-length" min="8" max="64" value="16">
        </div>
        <div class="pwgen-options">
          <label class="checkbox-label"><input type="checkbox" id="pwgen-upper" checked> 大寫字母 (A-Z)</label>
          <label class="checkbox-label"><input type="checkbox" id="pwgen-lower" checked> 小寫字母 (a-z)</label>
          <label class="checkbox-label"><input type="checkbox" id="pwgen-numbers" checked> 數字 (0-9)</label>
          <label class="checkbox-label"><input type="checkbox" id="pwgen-symbols" checked> 特殊符號 (!@#$...)</label>
        </div>
        <button class="btn btn-primary btn-full" id="pwgen-generate">🔄 重新產生</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="pwgen-cancel">取消</button>
        <button class="btn btn-primary" id="pwgen-use">使用此密碼</button>
      </div>
    </div>
  </div>

  <!-- ===== 分類新增 Modal ===== -->
  <div class="modal-overlay" id="category-overlay" style="display:none;">
    <div class="modal modal-sm" id="category-modal">
      <div class="modal-header">
        <h3 class="modal-title">新增分類</h3>
        <button class="modal-close" id="category-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label>分類名稱</label>
          <input type="text" id="cat-name" placeholder="例如：購物、銀行...">
        </div>
        <div class="input-group">
          <label>圖示 (Emoji)</label>
          <input type="text" id="cat-icon" placeholder="例如：🛒" maxlength="2">
        </div>
        <div class="input-group">
          <label>顏色</label>
          <div class="color-picker">
            <button class="color-swatch active" data-color="#6366f1" style="background:#6366f1"></button>
            <button class="color-swatch" data-color="#ec4899" style="background:#ec4899"></button>
            <button class="color-swatch" data-color="#10b981" style="background:#10b981"></button>
            <button class="color-swatch" data-color="#f59e0b" style="background:#f59e0b"></button>
            <button class="color-swatch" data-color="#3b82f6" style="background:#3b82f6"></button>
            <button class="color-swatch" data-color="#ef4444" style="background:#ef4444"></button>
            <button class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6"></button>
            <button class="color-swatch" data-color="#14b8a6" style="background:#14b8a6"></button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="category-cancel">取消</button>
        <button class="btn btn-primary" id="category-save">建立</button>
      </div>
    </div>
  </div>

  <!-- ===== Toast 通知 ===== -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
